<style>
#cua-screen-traces .trace-slots,#cua-screen-traces .trace-grid,#cua-screen-traces .trace-note{margin-top:calc(var(--font-size-base)*.8)}
#cua-screen-traces .trace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--font-size-base)*.9)}
#cua-screen-traces figure{margin:0;min-width:0}
#cua-screen-traces img{display:block;width:100%;height:auto;margin:calc(var(--font-size-base)*.4) 0}
@media(max-width:620px){#cua-screen-traces .trace-grid{grid-template-columns:1fr}}
</style>
<script>
(() => {
 const root=document.getElementById("cua-screen-traces");
 const data=JSON.parse(root.querySelector(".trace-data").textContent);
 const task=root.querySelector("select");
 const buttons=[...root.querySelectorAll(".trace-slots button")];
 const figures=[...root.querySelectorAll("figure")];
 let pair=0, stage=3;
 function render(){
   const current=data[pair];
   task.value=String(pair);
   buttons.forEach((button,i)=>{button.textContent=current.stages[i];button.setAttribute("aria-pressed",String(i===stage));});
   figures.forEach((figure,i)=>{
     const run=current.runs[i],frame=run.frames[stage];
     figure.querySelector("h3").textContent=run.label+" · 第 "+frame.step+" / "+run.length+" 步";
     const image=figure.querySelector("img");image.src=frame.image;image.alt=frame.caption;
     figure.querySelector("figcaption").textContent=frame.caption;
   });
   root.querySelector(".trace-note").textContent=current.note;
 }
 function restore(s){if(s&&[0,1].includes(s.pair)&&Number.isInteger(s.stage)&&s.stage>=0&&s.stage<4){pair=s.pair;stage=s.stage;}}
 function update(){render();window.openai?.setWidgetState?.({modelContent:{pair,stage},privateContent:{pair,stage}})?.catch(()=>{});}
 restore(window.openai?.widgetState?.privateContent??window.openai?.widgetState);
 task.addEventListener("change",()=>{pair=Number(task.value);update();});
 buttons.forEach((b,i)=>b.addEventListener("click",()=>{stage=i;update();}));
 window.addEventListener("openai:set_globals",e=>{const s=e.detail?.globals?.widgetState;restore(s?.privateContent??s);render();});
 render();
})();
</script>
